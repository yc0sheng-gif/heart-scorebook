<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#123d32"><meta name="description" content="拱豬計分簿，記錄四人每局得分及本場累計"><link rel="manifest" href="manifest.webmanifest"><title>拱豬計分簿</title>
<style>
:root{--gold:#e4c77b;--text:#fff8e8;--muted:#c3d1c8;--line:#416456;--blue:#72b7ff;--red:#ff9188;--record-size:16px;--s-body:16px;--s-help:13px;--s-footer:12px;--s-notes:16px;--s-backup:16px;--s-keypad:18px;--s-notice:22px;--s-title:25px;--s-heading:20px;--s-label:14px;--s-button:16px;--s-input:16px;--s-player:17px;--s-meta:12px;--s-total:21px;--s-round:16px;--s-note:16px;--s-backup:16px}*{box-sizing:border-box}body{margin:0;background:linear-gradient(160deg,#0d211c,#102d25 55%,#17382d);color:var(--text);font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;font-size:var(--s-body)}header{padding:18px 16px 12px;text-align:center;border-bottom:1px solid var(--line);background:#102a22}h1{font-size:var(--s-title);margin:0;color:var(--gold);letter-spacing:2px}header small{display:none}main{max-width:760px;margin:auto;padding:14px 13px 90px}nav{position:sticky;top:0;z-index:5;display:grid;grid-template-columns:repeat(2,1fr);gap:7px;background:#102a22;padding:8px;border-bottom:1px solid var(--line)}button,select,input{font:inherit}button{font-size:var(--s-button);border:1px solid #8d7946;border-radius:12px;padding:11px 13px;background:#294c3e;color:var(--text);font-weight:650;cursor:pointer}button.primary{background:linear-gradient(135deg,#e8d18f,#b9944e);color:#17271f;border:0}button.ghost{background:transparent;border-color:var(--line)}button:disabled{opacity:.4;cursor:not-allowed}.quicklinks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;padding:10px;background:#102a22}.quicklinks button{width:100%;padding:9px 4px}.tab{display:none}.tab.active{display:block}.card{background:rgba(23,55,46,.96);border:1px solid var(--line);border-radius:17px;padding:15px;margin:12px 0;box-shadow:0 5px 18px #0002}h2{font-size:var(--s-heading);color:var(--gold);margin:2px 0 13px}h3{font-size:var(--s-player);margin:8px 0;color:#f3dfaa}label{display:block;color:var(--muted);font-size:var(--s-label);margin:10px 0 5px}input,select{font-size:var(--s-input);width:100%;padding:12px;border:1px solid #587466;border-radius:10px;background:#0e2921;color:var(--text);min-height:46px}.row{display:flex;gap:9px;align-items:center}.row>*{flex:1}.muted{color:var(--muted);font-size:var(--s-help)}.notice{padding:13px;border-radius:13px;background:#284c3d;text-align:center;margin:10px 0}.notice strong{display:block;font-size:var(--s-notice);color:#f0d68d;margin:4px}.player-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.player-score{background:#102b23;border:1px solid var(--line);border-radius:13px;padding:11px}.player-score h3{margin:0 0 8px}.score-table{width:100%;border-collapse:collapse}.score-table th,.score-table td{padding:9px 3px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}.score-table th{color:var(--gold)}.totals-table{font-size:var(--s-total)}.totals-table th,.totals-table td{padding:13px 7px}.round-table{font-size:var(--s-round);table-layout:fixed}.round-table th:first-child,.round-table td:first-child{width:12%}.round-table th:last-child,.round-table td:last-child{width:12%}.round-table th,.round-table td{padding:10px 1px;white-space:normal;overflow-wrap:anywhere}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.actions button{flex:1;min-width:115px}.listitem{border-bottom:1px solid var(--line)}.positive{color:var(--blue);font-weight:750}.negative{color:var(--red);font-weight:750}.zero{color:var(--text)}.seat-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.pill{display:inline-block;padding:4px 9px;border-radius:99px;background:#315b49;color:#f5e4b8;font-size:var(--s-meta)}.score-pad{margin:10px auto 4px;padding:9px;background:#0e2921;border:1px solid var(--line);border-radius:12px;max-width:310px}.score-pad[hidden]{display:none}.keypad-readout{text-align:center;min-height:28px;color:var(--gold);font-weight:700}.keypad-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.keypad-grid button{min-height:34px;padding:5px;font-size:var(--s-keypad)}.keypad-done{width:100%;margin-top:6px;padding:7px}.settings-overlay{position:fixed;inset:0;z-index:20;background:#0009;display:flex;align-items:center;justify-content:center;padding:12px}.settings-overlay[hidden]{display:none}.settings-panel{background:#17372e;border:1px solid var(--line);border-radius:16px;padding:16px;width:min(100%,540px);max-height:90vh;overflow:auto}.settings-panel h2{margin:0}.settings-close{flex:0 0 auto}.settings-controls{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;margin:12px 0}.size-control{padding:7px 0;border-bottom:1px solid var(--line)}.size-control label{margin:0 0 3px}.size-control input{padding:0;min-height:auto;height:28px;accent-color:#e4c77b}.pencil{min-width:38px;padding:6px 2px;font-size:20px;border-color:var(--line);background:transparent}footer{text-align:center;color:var(--muted);font-size:var(--s-footer);padding:18px}#notesCard{font-size:var(--s-notes)}#notesCard h2{font-size:var(--s-notes)}#backup{font-size:var(--s-backup)}#backup h2{font-size:var(--s-backup)}@media(max-width:420px){.player-grid{grid-template-columns:1fr 1fr}.card{padding:12px}.totals-table{font-size:var(--s-total)}.round-table th,.round-table td{padding:9px 0}}
</style>
</head>
<body>
<header><h1>拱豬計分簿</h1></header>
<div class="quicklinks"><button class="ghost" onclick="jumpTo('totalsCard')">本場累計</button><button class="ghost" onclick="jumpTo('roundCard')">各局紀錄</button><button class="ghost" onclick="jumpTo('notesCard')">筆記本</button><button class="ghost" onclick="openSettings()">設定</button></div>
<nav><button class="primary" data-tab="play">目前牌局</button><button data-tab="backup">備份與還原</button></nav>
<main>
<section id="play" class="tab active">
 <div id="noMatch" class="card"><h2>開始新場</h2><button class="primary" id="startMatch">開啟新場</button></div>
 <div id="matchArea" hidden>
  <div class="card" id="scoreCard"><div class="row"><span class="pill" id="matchDate"></span><span class="pill" id="roundPill">第 1 局</span></div><h2>輸入本局分數</h2><p class="muted">空白分數會以 0 分儲存。</p><div class="player-grid" id="scoreInputs"></div><div id="scorePad" class="score-pad" hidden><div class="keypad-readout" id="keypadReadout">選取分數</div><div class="keypad-grid"><button type="button" data-key="7">7</button><button type="button" data-key="8">8</button><button type="button" data-key="9">9</button><button type="button" data-key="4">4</button><button type="button" data-key="5">5</button><button type="button" data-key="6">6</button><button type="button" data-key="1">1</button><button type="button" data-key="2">2</button><button type="button" data-key="3">3</button><button type="button" data-key="sign">±</button><button type="button" data-key="0">0</button><button type="button" data-key="back">⌫</button></div><button type="button" class="ghost keypad-done" id="keypadDone">完成輸入</button></div><div class="actions"><button class="primary" id="saveRound">儲存本局</button><button class="ghost" id="cancelEdit" hidden>取消修改</button></div></div>
  <div class="card" id="totalsCard"><h2>本場累計</h2><div id="totals"></div><div id="goalNotice"></div></div>
  <div class="card" id="roundCard"><h2>本場各局紀錄</h2><div id="roundList"></div></div>
  <div class="card" id="notesCard"><h2>筆記本</h2><p class="muted">記錄本場下次接續時的座位順序與下一位領牌人（即吃豬人）。</p><div class="seat-grid" id="seatInputs"></div><label>下一位領牌人（即吃豬人）</label><select id="dealer"></select><div class="actions"><button class="primary" id="saveNotes">儲存筆記</button></div><div id="noteSaved" class="muted"></div></div>
 </div>
</section>
<section id="backup" class="tab"><div class="card"><h2>資料備份與還原</h2><p>匯出 Excel 可開啟的 CSV，或完整 JSON 備份（包含進行中與已結束牌局、逐局分數及筆記）。</p><div class="actions"><button class="primary" id="exportCsv">匯出成績 CSV</button><button id="exportJson">匯出完整備份 JSON</button></div><label>選擇 JSON 備份檔還原</label><input type="file" id="importJson" accept=".json,application/json"><p class="muted">還原會以備份檔內容取代目前手機內的資料。舊版紅心大戰 JSON 備份也可匯入，原有每局總分會保留。</p></div></section>
<footer>資料保存在這支手機的瀏覽器中。請定期匯出 JSON 備份。</footer>
<div id="settingsOverlay" class="settings-overlay" hidden><div class="settings-panel" role="dialog" aria-modal="true" aria-labelledby="settingsTitle"><div class="row"><h2 id="settingsTitle">文字大小設定</h2><button class="ghost settings-close" onclick="closeSettings()" aria-label="關閉設定">關閉</button></div><p class="muted">每一類文字可分別調整，設定會保存在本機。</p><div id="settingsControls" class="settings-controls"></div><button id="resetSettings" class="ghost">恢復預設字級</button></div></div></main>
<script>
const KEY='heartScorebookV1',NAMES=['媽媽','二姊','小青','鳳秋'],IDS=['fixed-mom','fixed-sister','fixed-qing','fixed-feng'];let db=loadDB(),currentEdit=null;
function emptyDB(){return{version:2,players:NAMES.map((name,i)=>({id:IDS[i],name})),matches:[],active:null}}
function loadDB(){try{return normalize(JSON.parse(localStorage.getItem(KEY)))}catch(e){return emptyDB()}}
function normalize(x){if(!x||!Array.isArray(x.players)||!Array.isArray(x.matches))return emptyDB();let map={},players=NAMES.map((name,i)=>({id:IDS[i],name}));x.players.forEach((p,i)=>{let known=NAMES.indexOf(p.name);map[p.id]=IDS[known>=0?known:i%4]});let matches=x.matches.map(m=>{let old=m.players||x.players.slice(0,4).map(p=>p.id),ids=old.map((id,i)=>map[id]||IDS[i%4]);if(new Set(ids).size<4)ids=IDS.slice();let rounds=(m.rounds||[]).map(r=>{let scores={};ids.forEach((id,i)=>scores[id]=Number(r.scores?.[old[i]]??r.scores?.[id]??0));return{scores}});let n=m.notes||{},seats=(n.seats||[]).map(id=>map[id]||IDS[NAMES.indexOf(id)]).filter(Boolean);let dealer=map[n.dealer]||n.dealer||IDS[0];return{...m,players:IDS.slice(),rounds,notes:{seats:seats.length===4&&new Set(seats).size===4?seats:IDS.slice(),dealer,pigEater:dealer},finished:!!m.finished}});let active=x.active;if(!matches.some(m=>m.id===active&&!m.finished))active=matches.find(m=>!m.finished)?.id||null;return{version:2,players,matches,active}}
function saveDB(){localStorage.setItem(KEY,JSON.stringify(db));renderAll()}function uid(){return'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,7)}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function fmt(n){n=Number(n)||0;return(n>0?'+':'')+n}function cls(n){return n>0?'positive':n<0?'negative':'zero'}function name(id){return NAMES[IDS.indexOf(id)]||'未知玩家'}function active(){return db.matches.find(m=>m.id===db.active&&!m.finished)}function tab(id){document.querySelectorAll('.tab').forEach(e=>e.classList.toggle('active',e.id===id));document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('primary',b.dataset.tab===id))}document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>tab(b.dataset.tab));function totals(m){let t=Object.fromEntries(IDS.map(id=>[id,0]));m.rounds.forEach(r=>IDS.forEach(id=>t[id]+=Number(r.scores?.[id]||0)));return t}
function jumpTo(id){const e=document.getElementById(id);if(e){e.scrollIntoView({behavior:'smooth',block:'start'})}}
function renderMatch(){let m=active()||[...db.matches].reverse().find(x=>x.finished);document.getElementById('noMatch').hidden=!!m;document.getElementById('matchArea').hidden=!m;if(!m)return;document.getElementById('scoreCard').hidden=!!m.finished;document.getElementById('matchDate').textContent=new Date(m.date).toLocaleString('zh-TW');document.getElementById('roundPill').textContent=`第 ${m.rounds.length+1} 局`;document.getElementById('scoreInputs').innerHTML=IDS.map(id=>`<div class="player-score" data-player="${id}"><h3>${name(id)}</h3><label>本局得分</label><input class="score" type="text" inputmode="none" readonly aria-label="本局分數，使用下方數字鍵盤輸入" value=""></div>`).join('');document.getElementById('cancelEdit').hidden=currentEdit===null;if(!m.finished&&currentEdit===null)setTimeout(()=>document.querySelector('#scoreInputs .score')?.focus({preventScroll:true}),0);let t=totals(m);document.getElementById('totals').innerHTML=`<table class="score-table totals-table"><tr><th>玩家</th><th>本場累計</th></tr>${IDS.map(id=>`<tr><td>${name(id)}</td><td class="${cls(t[id])}">${fmt(t[id])}</td></tr>`).join('')}</table>`;let achiever=IDS.find(id=>t[id]>=1000||t[id]<=-1000);document.getElementById('goalNotice').innerHTML=m.finished?`<div class="notice"><span>${achiever?'本場目標達成':'本場已結束'}</span><strong>${achiever?`${name(achiever)} ${t[achiever]>=1000?'達到 +1000（最贏）':'達到 -1000（最輸）'}`:'可開啟新場'}</strong><div class="actions"><button class="primary" onclick="newMatch()">開啟新場</button></div></div>`:'';document.getElementById('roundList').innerHTML=`<table class="score-table round-table"><thead><tr><th>局數</th>${IDS.map(id=>`<th>${name(id)}</th>`).join('')}<th>編輯</th></tr></thead><tbody>${m.rounds.map((r,i)=>`<tr><td>${i+1}</td>${IDS.map(id=>`<td class="${cls(r.scores[id])}">${fmt(r.scores[id])}</td>`).join('')}<td><button class="pencil" aria-label="編輯第 ${i+1} 局" onclick="editRound(${i})">✏️</button></td></tr>`).join('')}</tbody></table>${m.rounds.length?'':'<p class="muted">尚未登錄任何局數。</p>'}`;renderNotes(m)}
function renderNotes(m){let n=m.notes||(m.notes={seats:IDS.slice(),dealer:IDS[0]});document.getElementById('seatInputs').innerHTML=IDS.map((_,i)=>`<div><label>座位 ${i+1}</label><select class="seat" data-seat="${i}">${IDS.map(id=>`<option value="${id}" ${n.seats[i]===id?'selected':''}>${name(id)}</option>`).join('')}</select></div>`).join('');let opts='<option value="">請選擇</option>'+IDS.map(id=>`<option value="${id}">${name(id)}</option>`).join('');document.getElementById('dealer').innerHTML=opts;document.getElementById('dealer').value=n.dealer||'';document.getElementById('saveNotes').hidden=!!m.finished;document.getElementById('noteSaved').textContent=m.finished?'本場已結束。':'記得按「儲存筆記」保存本機資料。'}
window.newMatch=()=>{let m={id:uid(),date:new Date().toISOString(),players:IDS.slice(),rounds:[],finished:false,notes:{seats:IDS.slice(),dealer:IDS[0],pigEater:IDS[0]}};db.matches.push(m);db.active=m.id;currentEdit=null;saveDB();tab('play')};document.getElementById('startMatch').onclick=()=>window.newMatch();
document.getElementById('saveRound').onclick=()=>{let m=active();if(!m)return;let scores={};document.querySelectorAll('.player-score').forEach(el=>scores[el.dataset.player]=(parseInt(el.querySelector('.score').value,10)||0));if(currentEdit!==null){m.rounds[currentEdit]={scores};currentEdit=null}else m.rounds.push({scores});let t=totals(m),winner=IDS.find(id=>t[id]>=1000||t[id]<=-1000);if(winner){m.finished=true;m.endDate=new Date().toISOString();db.active=null;currentEdit=null}saveDB();if(winner)alert(`${name(winner)} 累計 ${fmt(t[winner])}，已達到本場目標，本場結束。`)};
window.editRound=i=>{let m=active();if(!m)return;currentEdit=i;document.querySelectorAll('.player-score').forEach(el=>el.querySelector('.score').value=m.rounds[i].scores[el.dataset.player]??0);document.getElementById('cancelEdit').hidden=false;window.scrollTo({top:0,behavior:'smooth'});setTimeout(()=>document.querySelector('#scoreInputs .score')?.focus({preventScroll:true}),0)};document.getElementById('cancelEdit').onclick=()=>{currentEdit=null;renderMatch()};document.getElementById('saveNotes').onclick=()=>{let m=active();if(!m)return;let seats=[...document.querySelectorAll('.seat')].map(s=>s.value);if(new Set(seats).size!==4){alert('座位 1 至 4 請選擇不同玩家。');return}let dealer=document.getElementById('dealer').value;m.notes={seats,dealer,pigEater:dealer};saveDB();alert('筆記已儲存。')};
const FONT_GROUPS=[['一般文字','--s-body',16],['輔助說明','--s-help',13],['標題','--s-title',25],['區塊標題','--s-heading',20],['表單標籤','--s-label',14],['按鍵文字','--s-button',16],['輸入文字','--s-input',16],['玩家姓名','--s-player',17],['日期與局數','--s-meta',12],['本場累計','--s-total',21],['各局紀錄','--s-round',16],['筆記本文字','--s-notes',16],['備份頁文字','--s-backup',16],['數字鍵盤','--s-keypad',18],['提示訊息','--s-notice',22],['頁尾文字','--s-footer',12]];
function loadFontSettings(){try{return JSON.parse(localStorage.getItem('scorebookFontSettings')||'{}')}catch(e){return{}}}
function applyFontSettings(){let cfg=loadFontSettings();FONT_GROUPS.forEach(([label,key,def])=>{let value=Number(cfg[key])||def;document.documentElement.style.setProperty(key,value+'px')})}
function buildSettings(){let cfg=loadFontSettings();document.getElementById('settingsControls').innerHTML=FONT_GROUPS.map(([label,key,def])=>`<div class="size-control"><label for="size-${key.slice(2)}">${label} <span id="value-${key.slice(2)}">${cfg[key]||def}px</span></label><input id="size-${key.slice(2)}" type="range" min="10" max="36" step="1" value="${cfg[key]||def}" data-font-key="${key}"></div>`).join('');document.querySelectorAll('[data-font-key]').forEach(input=>input.oninput=()=>{let all=loadFontSettings(),k=input.dataset.fontKey;all[k]=Number(input.value);localStorage.setItem('scorebookFontSettings',JSON.stringify(all));document.getElementById(`value-${k.slice(2)}`).textContent=input.value+'px';applyFontSettings()})}
function openSettings(){buildSettings();document.getElementById('settingsOverlay').hidden=false}
function closeSettings(){document.getElementById('settingsOverlay').hidden=true}
document.getElementById('resetSettings').onclick=()=>{localStorage.removeItem('scorebookFontSettings');buildSettings();applyFontSettings()};document.getElementById('settingsOverlay').onclick=e=>{if(e.target.id==='settingsOverlay')closeSettings()};
let keypadField=null;function showKeypad(field){keypadField=field;document.getElementById('scorePad').hidden=false;document.getElementById('keypadReadout').textContent=field.value||'選取分數'}
document.getElementById('scoreInputs').addEventListener('focusin',e=>{if(e.target.classList.contains('score'))showKeypad(e.target)});
document.getElementById('scorePad').addEventListener('click',e=>{let key=e.target.dataset.key;if(!key||!keypadField)return;let v=keypadField.value;if(key==='back')v=v.slice(0,-1);else if(key==='sign')v=v.startsWith('-')?v.slice(1):'-'+v;else v=(v==='0'?'':v)+key;keypadField.value=v;document.getElementById('keypadReadout').textContent=v||'0'})
document.getElementById('keypadDone').onclick=()=>{document.getElementById('scorePad').hidden=true;keypadField?.blur();keypadField=null};
applyFontSettings();document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSettings()});
function renderAll(){renderMatch()}function download(n,c,t){let a=document.createElement('a'),u=URL.createObjectURL(new Blob([c],{type:t}));a.href=u;a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}function cell(v){return'"'+String(v??'').replace(/"/g,'""')+'"'}document.getElementById('exportCsv').onclick=()=>{let rows=[['日期','場次ID','局數','玩家','座位','本局分數','本場累計','是否結束']];db.matches.forEach(m=>{let running=Object.fromEntries(IDS.map(id=>[id,0]));m.rounds.forEach((r,i)=>{IDS.forEach(id=>running[id]+=Number(r.scores[id]||0));IDS.forEach((id,pos)=>rows.push([new Date(m.date).toLocaleString('zh-TW'),m.id,i+1,name(id),pos+1,r.scores[id],running[id],m.finished?'是':'否']))})});download('拱豬計分簿成績.csv','\ufeff'+rows.map(r=>r.map(cell).join(',')).join('\r\n'),'text/csv;charset=utf-8')};document.getElementById('exportJson').onclick=()=>download('拱豬計分簿完整備份.json',JSON.stringify(db,null,2),'application/json');document.getElementById('importJson').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let d=normalize(JSON.parse(await f.text()));if(!confirm('確定以備份檔取代本機現有資料？'))return;db=d;saveDB();alert('資料還原完成。')}catch(err){alert('檔案格式不正確，無法還原。')}e.target.value=''};renderAll();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script>
</body></html>
