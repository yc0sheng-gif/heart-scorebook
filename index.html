<style>

dding:9px 4px}.tab{display:none}.tab.active{display:block}.card{background:var(--panel);border:1px solid var(--line);border-radius:17px;padding:15px;margin:12px 0;box-shadow:0 5px 18px #0002}h2{font-size:var(--s-heading);color:var(--gold);margin:2px 0 13px}h3{font-size:var(--s-player);margin:8px 0;color:var(--heading)}label{display:block;color:var(--muted);font-size:var(--s-label);margin:10px 0 5px}input,select{font-size:var(--s-input);width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--inputbg);color:var(--text);min-height:46px}.row{display:flex;gap:9px;align-items:center}.row>*{flex:1}.muted{color:var(--muted);font-size:var(--s-help)}.notice{padding:13px;border-radius:13px;background:var(--noticebg);text-align:center;margin:10px 0}.notice strong{display:block;font-size:var(--s-notice);color:var(--gold);margin:4px}.player-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.player-score{background:var(--scorecard);border:1px solid var(--line);border-radius:13px;padding:11px}.player-score h3{margin:0 0 8px}.score-table{width:100%;border-collapse:collapse}.score-table th,.score-table td{padding:9px 3px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}.score-table th{color:var(--gold)}.record-match{margin:16px 0;padding-top:10px;border-top:1px solid var(--line)}.record-match-title{display:flex;align-items:center;gap:8px}.record-match-title h3{flex:1}.delete-record{flex:0 0 auto;border-color:var(--scorered);font-size:var(--s-button);padding:7px 10px}.record-table{font-size:var(--s-round);table-layout:fixed}.record-table th,.record-table td{padding:8px 2px;white-space:normal;overflow-wrap:anywhere;text-align:center;border-bottom:1px solid var(--line)}.record-table th:first-child{width:25%}.record-table th:nth-child(2){width:14%}.record-table th{color:var(--gold)}.record-table .total-row{border-top:2px solid var(--gold);font-weight:800}.totals-table{font-size:var(--s-total)}.totals-table th,.totals-table td{padding:13px 7px}.round-table{font-size:var(--s-round);table-layout:fixed}.round-table .round-total-row{background:var(--noticebg);font-weight:850}.round-table .round-total-row th,.round-table .round-total-row td{border-bottom:4px solid #ff9f38;padding-top:10px;padding-bottom:10px}.round-table th:first-child,.round-table td:first-child{width:12%}.round-table th:last-child,.round-table td:last-child{width:12%}.round-table th,.round-table td{padding:8px 1px;white-space:normal;overflow-wrap:anywhere}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.actions button{flex:1;min-width:115px}.listitem{border-bottom:1px solid var(--line)}.positive{color:var(--scoreblue);font-weight:750}.negative{color:var(--scorered);font-weight:750}.zero{color:var(--text)}.seat-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.match-meta{display:flex;flex-direction:row;align-items:center;justify-content:space-between;gap:8px;margin:0 0 12px;padding:9px 12px;border:1px solid var(--line);border-radius:12px;background:var(--scorecard);font-size:var(--s-meta);color:var(--muted)}.match-meta span{font-size:calc(var(--s-meta)*1.3)}.match-meta strong{font-size:calc(var(--s-meta)*1.2);color:var(--gold);align-self:auto}.pill{display:inline-block;padding:4px 9px;border-radius:99px;background:var(--pillbg);color:#f5e4b8;font-size:var(--s-meta)}.score-pad{margin:10px auto 4px;padding:12px;background:var(--inputbg);border:1px solid var(--line);border-radius:12px;width:100%;max-width:420px}.score-pad[hidden]{display:none}.keypad-readout{font-size:var(--s-keypad);text-align:center;min-height:28px;color:var(--gold);font-weight:700}.keypad-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.keypad-grid button{min-height:50px;padding:8px;font-size:var(--s-keypad)}.keypad-done{width:100%;margin-top:6px;padding:7px}.settings-overlay{position:fixed;inset:0;z-index:20;background:#0009;display:flex;align-items:center;justify-content:center;padding:12px}.settings-overlay[hidden]{displ :root[data-palette="ocean"]{--gold:#8ee0ec;--text:#effaff;--muted:#bfd0dc;--line:#49687d;--page1:#101b2d;--page2:#132a42;--page3:#1c3a55;--header:#14243a;--panel:rgba(27,54,80,.97);--scorecard:#142c43;--inputbg:#101f32;--button:#31536b;--linegold:#6f9aaf;--gold2:#36798c;--primarytext:#f4fcff;--heading:#c6eaf0;--noticebg:#294d64;--pillbg:#315d73;--scoreblue:#8ad4ff;--scorered:#ff9188}:root[data-palette="grape"]{--gold:#edb5df;--text:#fff4fc;--muted:#d0bfd4;--line:#694c73;--page1:#20182b;--page2:#30213a;--page3:#412c4a;--header:#291d35;--panel:rgba(57,39,68,.97);--scorecard:#2e2038;--inputbg:#211828;--button:#523859;--linegold:#9a7198;--gold2:#a05e96;--primarytext:#fff8ff;--heading:#f0d5eb;--noticebg:#563d5c;--pillbg:#604568;--scoreblue:#91caff;--scorered:#ff9d9d}:root[data-palette="terracotta"]{--gold:#ffc485;--text:#fff5eb;--muted:#d8c4ad;--line:#795842;--page1:#271b18;--page2:#3a261e;--page3:#4c3024;--header:#33221c;--panel:rgba(74,48,38,.97);--scorecard:#38251e;--inputbg:#2b1c18;--button:#614331;--linegold:#a9784f;--gold2:#aa6135;--primarytext:#fff9ef;--heading:#f1d4b0;--noticebg:#624333;--pillbg:#754c34;--scoreblue:#85c8ff;--scorered:#ff9c8b}:root[data-palette="slate"]{--gold:#b4c8ff;--text:#f2f6ff;--muted:#c1cad9;--line:#526276;--page1:#171e2b;--page2:#222d3e;--page3:#2d3b50;--header:#1d2737;--panel:rgba(38,52,72,.97);--scorecard:#202d40;--inputbg:#171f2d;--button:#3c5069;--linegold:#788ba4;--gold2:#687fa9;--primarytext:#f5f7ff;--heading:#d3ddf4;--noticebg:#394c64;--pillbg:#455c78;--scoreblue:#8ecfff;--scorered:#ff9d9d}

<body>
<header><h1>拱豬計分簿</h1></header>
<div class="quicklinks"><div class="quicklink-column"><button class="ghost" onclick="jumpTo('totalsCard')">本場累計</button><button class="ghost" onclick="jumpTo('roundCard')">各局記錄</button><button class="ghost" onclick="tab('play')">目前牌局</button></div><div class="quicklink-column"><button class="ghost" onclick="tab('backup')">查詢備份</button><button class="ghost" onclick="openSettings()">設　定</button><button class="ghost" onclick="jumpTo('notesCard')">筆記本</button></div></div>

<main>
<section id="play" class="tab active">
 <div id="noMatch" class="card"><h2>開始新場</h2><button class="primary" id="startMatch">開啟新場</button></div>
 <div id="matchArea" hidden>
  <div class="card" id="scoreCard"><div class="match-meta"><span id="matchDate"></span><strong id="roundPill">第 1 局</strong></div><h2>輸入本局分數</h2><p class="muted">空白分數會以 0 分儲存。</p><div class="player-grid" id="scoreInputs"></div><div id="scorePad" class="score-pad" hidden><div class="keypad-readout" id="keypadReadout">選取分數</div><div class="keypad-grid"><button type="button" data-key="7">7</button><button type="button" data-key="8">8</button><button type="button" data-key="9">9</button><button type="button" data-key="4">4</button><button type="button" data-key="5">5</button><button type="button" data-key="6">6</button><button type="button" data-key="1">1</button><button type="button" data-key="2">2</button><button type="button" data-key="3">3</button><button type="button" data-key="sign">±</button><button type="button" data-key="0">0</button><button type="button" data-key="back">⌫</button></div></div><div class="actions"><button class="primary" id="saveRound">儲存本局</button><button class="ghost" id="cancelEdit" hidden>取消修改</button></div></div>
  <div class="card" id="roundCard"><h2>本場各局紀錄</h2><div id="roundList"></div></div>
  <div class="card" id="totalsCard"><h2>本場累計</h2><div id="totals"></div><div id="goalNotice"></div></div>
  <div class="card" id="notesCard"><h2>筆記本</h2><p class="muted">記錄本場下次接續時的座位順序與下一位領牌人（即吃豬人）。</p><div class="seat-grid" id="seatInputs"></div><label>下一位領牌人（即吃豬人）</label><select id="dealer"></select><div class="actions"><button class="primary" id="saveNotes">儲存筆記</button></div><div id="noteSaved" class="muted"></div></div>
 </div>
</section>
<section id="backup" class="tab"><div class="card"><h2>查詢備份</h2><p>查詢各場逐局得分；已結束場次會附上本場累計。</p><div class="actions"><button class="primary" id="queryRecords">查詢</button><button id="exportCsv">匯出 CSV</button></div><div id="recordResults" hidden></div></div></section>
<footer>牌局記錄保存在這支手機的瀏覽器中，可從「查詢備份」匯出 CSV。</footer>
<div id="settingsOverlay" class="settings-overlay" hidden><div class="settings-panel" role="dialog" aria-modal="true" aria-labelledby="settingsTitle"><h2 id="settingsTitle">設定所有文字大小</h2><p class="muted">每一類文字可分別調整，設定會保存在本機。</p><div id="settingsControls" class="settings-controls"></div><h3>配色</h3><p class="muted">選擇一組適合閱讀的配色。</p><div id="paletteChoices" class="palette-choices"><button class="palette-option" data-palette="forest"><span class="swatch" style="--swatch:#e4c77b;background:#17372e"></span>黃綠（原色）</button><button class="palette-option" data-palette="ocean"><span class="swatch" style="--swatch:#8ee0ec;background:#1b3650"></span>海洋藍</button><button class="palette-option" data-palette="grape"><span class="swatch" style="--swatch:#edb5df;background:#392744"></span>葡萄紫</button><button class="palette-option" data-palette="terracotta"><span class="swatch" style="--swatch:#ffc485;background:#4a3026"></span>夕陽陶</button><button class="palette-option" data-palette="slate"><span class="swatch" style="--swatch:#b4c8ff;background:#263448"></span>石板藍</button><button class="palette-option" data-palette="teal"><span class="swatch" style="--swatch:#7de1c2;background:#183d3b"></span>深海青</button><button class="palette-option" data-palette="sakura"><span class="swatch" style="--swatch:#ffb6cb;background:#402334"></span>櫻花粉</button><button class="palette-option" data-palette="charcoal"><span class="swatch" style="--swatch:#c9d2df;background:#303642"></span>黑曜灰</button></div><div class="settings-bottom"><button id="resetSettings" class="ghost">恢復預設字級與配色</button><button id="settingsCloseBottom" class="primary">關閉</button></div></div></div></main>
<script>
const KEY='heartScorebookV1',NAMES=['媽媽','二姊','小青','鳳秋'],IDS=['fixed-mom','fixed-sister','fixed-qing','fixed-feng'];let db=loadDB(),currentEdit=null;
function emptyDB(){return{version:2,players:NAMES.map((name,i)=>({id:IDS[i],name})),matches:[],active:null}}
function loadDB(){try{return normalize(JSON.parse(localStorage.getItem(KEY)))}catch(e){return emptyDB()}}
function normalize(x){if(!x||!Array.isArray(x.players)||!Array.isArray(x.matches))return emptyDB();let map={},players=NAMES.map((name,i)=>({id:IDS[i],name}));x.players.forEach((p,i)=>{let known=NAMES.indexOf(p.name);map[p.id]=IDS[known>=0?known:i%4]});let matches=x.matches.map(m=>{let old=m.players||x.players.slice(0,4).map(p=>p.id),ids=old.map((id,i)=>map[id]||IDS[i%4]);if(new Set(ids).size<4)ids=IDS.slice();let rounds=(m.rounds||[]).map(r=>{let scores={};ids.forEach((id,i)=>scores[id]=Number(r.scores?.[old[i]]??r.scores?.[id]??0));return{...r,scores}});let n=m.notes||{},seats=(n.seats||[]).map(id=>map[id]||IDS[NAMES.indexOf(id)]).filter(Boolean);let dealer=map[n.dealer]||n.dealer||IDS[0];return{...m,players:IDS.slice(),rounds,notes:{seats:seats.length===4&&new Set(seats).size===4?seats:IDS.slice(),dealer,pigEater:dealer},finished:!!m.finished}});let active=x.active;if(!matches.some(m=>m.id===active&&!m.finished))active=matches.find(m=>!m.finished)?.id||null;return{version:2,players,matches,active}}
function saveDB(){localStorage.setItem(KEY,JSON.stringify(db));renderAll()}function uid(){return'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,7)}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function fmt(n){n=Number(n)||0;return(n>0?'+':'')+n}function cls(n){return n>0?'positive':n<0?'negative':'zero'}function name(id){return NAMES[IDS.indexOf(id)]||'未知玩家'}function active(){return db.matches.find(m=>m.id===db.active&&!m.finished)}function tab(id){document.querySelectorAll('.tab').forEach(e=>e.classList.toggle('active',e.id===id));document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('primary',b.dataset.tab===id))}document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>tab(b.dataset.tab));function totals(m){let t=Object.fromEntries(IDS.map(id=>[id,0]));m.rounds.forEach(r=>IDS.forEach(id=>t[id]+=Number(r.scores?.[id]||0)));return t}
function shortDateTime(value){return new Intl.DateTimeFormat('zh-TW',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date(value))}function jumpTo(id){tab('play');setTimeout(()=>{const e=document.getElementById(id);if(e)e.scrollIntoView({behavior:'smooth',block:'start'})},0)}
function renderMatch(){let m=active()||[...db.matches].reverse().find(x=>x.finished);document.getElementById('noMatch').hidden=!!m;document.getElementById('matchArea').hidden=!m;if(!m)return;document.getElementById('scoreCard').hidden=!!m.finished;document.getElementById('matchDate').textContent=shortDateTime(m.date);document.getElementById('roundPill').textContent=`第 ${m.rounds.length+1} 局`;document.getElementById('scoreInputs').innerHTML=IDS.map(id=>`<div class="player-score" data-player="${id}"><h3>${name(id)}</h3><label>本局得分</label><input class="score" type="text" inputmode="none" readonly aria-label="本局分數，使用下方數字鍵盤輸入" value=""></div>`).join('');document.getElementById('cancelEdit').hidden=currentEdit===null;document.getElementById('saveRound').textContent=currentEdit===null?'儲存本局':'確定修改';if(!m.finished&&currentEdit===null)setTimeout(()=>{const first=document.querySelector('#scoreInputs .score');if(first){first.focus({preventScroll:true});showKeypad(first)}},0);let t=totals(m);document.getElementById('totals').innerHTML=`<table class="score-table totals-table"><tr><th>玩家</th><th>本場累計</th></tr>${IDS.map(id=>`<tr><td>${name(id)}</td><td class="${cls(t[id])}">${fmt(t[id])}</td></tr>`).join('')}</table>`;let achiever=IDS.find(id=>t[id]>1000||t[id]<=-1000);document.getElementById('goalNotice').innerHTML=m.finished?`<div class="notice"><span>${achiever?'本場目標達成':'本場已結束'}</span><strong>${achiever?`${name(achiever)} ${t[achiever]>1000?'超過 +1000（最贏）':'達到 -1000（最輸）'}`:'可開啟新場'}</strong><div class="actions"><button class="primary" onclick="newMatch()">開啟新場</button></div></div>`:'';document.getElementById('roundList').innerHTML=`<table class="score-table round-table"><thead><tr><th>局數</th>${IDS.map(id=>`<th>${name(id)}</th>`).join('')}<th>編輯</th></tr></thead><tbody><tr class="round-total-row"><th>累計</th>${IDS.map(id=>`<td class="${cls(t[id])}">${fmt(t[id])}</td>`).join('')}<td></td></tr>${m.rounds.map((r,i)=>({r,i})).reverse().map(({r,i})=>`<tr><td>${i+1}</td>${IDS.map(id=>`<td class="${cls(r.scores[id])}">${fmt(r.scores[id])}</td>`).join('')}<td><button class="pencil" aria-label="編輯第 ${i+1} 局" onclick="editRound(${i})">✏️</button></td></tr>`).join('')}</tbody></table>${m.rounds.length?'':'<p class="muted">尚未登錄任何局數。</p>'}`;renderNotes(m)}
function renderNotes(m){let n=m.notes||(m.notes={seats:IDS.slice(),dealer:IDS[0]});document.getElementById('seatInputs').innerHTML=IDS.map((_,i)=>`<div><label>座位 ${i+1}</label><select class="seat" data-seat="${i}">${IDS.map(id=>`<option value="${id}" ${n.seats[i]===id?'selected':''}>${name(id)}</option>`).join('')}</select></div>`).join('');let opts='<option value="">請選擇</option>'+IDS.map(id=>`<option value="${id}">${name(id)}</option>`).join('');document.getElementById('dealer').innerHTML=opts;document.getElementById('dealer').value=n.dealer||'';document.getElementById('saveNotes').hidden=!!m.finished;document.getElementById('noteSaved').textContent=m.finished?'本場已結束。':'記得按「儲存筆記」保存本機資料。'}
window.newMatch=()=>{let m={id:uid(),date:new Date().toISOString(),players:IDS.slice(),rounds:[],finished:false,notes:{seats:IDS.slice(),dealer:IDS[0],pigEater:IDS[0]}};db.matches.push(m);db.active=m.id;currentEdit=null;saveDB();tab('play')};document.getElementById('startMatch').onclick=()=>window.newMatch();
document.getElementById('saveRound').onclick=()=>{let m=active();if(!m)return;let scores={};document.querySelectorAll('.player-score').forEach(el=>scores[el.dataset.player]=(parseInt(el.querySelector('.score').value,10)||0));if(IDS.every(id=>scores[id]===0)){alert('請至少輸入一位玩家的非零分數，才能儲存本局。');return}if(currentEdit!==null){m.rounds[currentEdit]={...m.rounds[currentEdit],scores};currentEdit=null}else m.rounds.push({scores,date:new Date().toISOString()});let t=totals(m),winner=IDS.find(id=>t[id]>1000||t[id]<=-1000);if(winner){m.finished=true;m.endDate=new Date().toISOString();db.active=null;currentEdit=null}saveDB();if(winner)alert(`${name(winner)} 累計 ${fmt(t[winner])}，已達到本場目標，本場結束。`)};
window.editRound=i=>{let m=active();if(!m)return;currentEdit=i;document.getElementById('saveRound').textContent='確定修改';document.querySelectorAll('.player-score').forEach(el=>el.querySelector('.score').value=m.rounds[i].scores[el.dataset.player]??0);document.getElementById('cancelEdit').hidden=false;window.scrollTo({top:0,behavior:'smooth'});setTimeout(()=>document.querySelector('#scoreInputs .score')?.focus({preventScroll:true}),0)};document.getElementById('cancelEdit').onclick=()=>{currentEdit=null;renderMatch()};document.getElementById('saveNotes').onclick=()=>{let m=active();if(!m)return;let seats=[...document.querySelectorAll('.seat')].map(s=>s.value);if(new Set(seats).size!==4){alert('座位 1 至 4 請選擇不同玩家。');return}let dealer=document.getElementById('dealer').value;m.notes={seats,dealer,pigEater:dealer};saveDB();alert('筆記已儲存。')};
const FONT_GROUPS=[['一般文字','--s-body',16],['輔助說明','--s-help',13],['標題','--s-title',25],['區塊標題','--s-heading',20],['表單標籤','--s-label',14],['按鍵文字','--s-button',16],['輸入文字','--s-input',16],['玩家姓名','--s-player',17],['日期與局數','--s-meta',12],['本場累計','--s-total',21],['各局紀錄','--s-round',16],['筆記本文字','--s-notes',16],['備份頁文字','--s-backup',16],['數字鍵盤','--s-keypad',22],['提示訊息','--s-notice',22],['頁尾文字','--s-footer',12]];
function loadFontSettings(){try{let cfg=JSON.parse(localStorage.getItem('scorebookFontSettings')||'{}');if(localStorage.getItem('scorebookKeypadFontRaised')!=='1'){if(!cfg['--s-keypad']||cfg['--s-keypad']<22)cfg['--s-keypad']=22;localStorage.setItem('scorebookFontSettings',JSON.stringify(cfg));localStorage.setItem('scorebookKeypadFontRaised','1')}return cfg}catch(e){return{}}}
function clampFont(def,value){return Math.max(def*.5,Math.min(def*2.1,Number(value)||def))}function applyFontSettings(){let cfg=loadFontSettings();FONT_GROUPS.forEach(([label,key,def])=>{let value=clampFont(def,cfg[key]);document.documentElement.style.setProperty(key,value+'px')})}
function fontPosition(def,value){let v=clampFont(def,value);if(v<=def*.5)return Math.round((v-def*.5)/(def*.5)*65);return Math.round(65+(v-def)/(def*1.1)*35)}function fontValue(def,pos){let p=Number(pos);let v=p<=65?def*(.5+.5*p/65):def*(1+1.1*(p-65)/35);return Math.round(v*10)/10}function buildSettings(){let cfg=loadFontSettings();document.getElementById('settingsControls').innerHTML=FONT_GROUPS.map(([label,key,def])=>{let value=clampFont(def,cfg[key]);return `<div class="size-control"><label for="size-${key.slice(2)}">${label} <span id="value-${key.slice(2)}">${value}px</span></label><input id="size-${key.slice(2)}" type="range" min="0" max="100" step="1" value="${fontPosition(def,value)}" data-font-key="${key}" data-font-default="${def}"></div>`}).join('');document.querySelectorAll('[data-font-key]').forEach(input=>input.oninput=()=>{let all=loadFontSettings(),k=input.dataset.fontKey,v=fontValue(Number(input.dataset.fontDefault),input.value);all[k]=v;localStorage.setItem('scorebookFontSettings',JSON.stringify(all));document.getElementById(`value-${k.slice(2)}`).textContent=v+'px';applyFontSettings()})}
function openSettings(){buildSettings();document.getElementById('settingsOverlay').hidden=false}
function closeSettings(){document.getElementById('settingsOverlay').hidden=true}
function applyPalette(key){let allowed=['forest','ocean','grape','terracotta','slate','teal','sakura','charcoal'];let selected=allowed.includes(key)?key:'forest';document.documentElement.dataset.palette=selected;const themeMeta=document.querySelector('meta[name=theme-color]');if(themeMeta)themeMeta.content=getComputedStyle(document.documentElement).getPropertyValue('--header').trim();localStorage.setItem('scorebookPalette',selected);document.querySelectorAll('.palette-option').forEach(b=>b.classList.toggle('selected',b.dataset.palette===selected))}applyPalette(localStorage.getItem('scorebookPalette')||'forest');document.getElementById('paletteChoices').onclick=e=>{let b=e.target.closest('[data-palette]');if(b)applyPalette(b.dataset.palette)};document.getElementById('settingsCloseBottom').onclick=closeSettings;document.getElementById('resetSettings').onclick=()=>{localStorage.removeItem('scorebookFontSettings');applyPalette('forest');buildSettings();applyFontSettings()};document.getElementById('settingsOverlay').onclick=e=>{if(e.target.id==='settingsOverlay')closeSettings()};
let keypadField=null;function showKeypad(field){keypadField=field;const pad=document.getElementById('scorePad');pad.hidden=false;document.getElementById('keypadReadout').textContent=field.value||'選取分數';requestAnimationFrame(()=>pad.scrollIntoView({behavior:'smooth',block:'center'}))}
document.getElementById('scoreInputs').addEventListener('focusin',e=>{if(e.target.classList.contains('score'))showKeypad(e.target)});document.getElementById('scoreInputs').addEventListener('pointerdown',e=>{if(e.target.classList.contains('score'))showKeypad(e.target)});
document.getElementById('scorePad').addEventListener('click',e=>{let key=e.target.dataset.key;if(!key||!keypadField)return;let v=keypadField.value;if(key==='back')v=v.slice(0,-1);else if(key==='sign')v=v.startsWith('-')?v.slice(1):'-'+v;else v=(v==='0'?'':v)+key;keypadField.value=v;document.getElementById('keypadReadout').textContent=v||'0'})

applyFontSettings();let exitFlowActive=false,exitConfirmed=false;function handleAppBack(){window.scrollTo(0,0);if(exitFlowActive)return;exitFlowActive=true;if(window.confirm('確定離開拱豬計分簿？')){exitConfirmed=true;history.back();setTimeout(()=>{exitConfirmed=false;exitFlowActive=false},600)}else{history.pushState({scorebookGuard:true},'',location.href);exitFlowActive=false}}history.pushState({scorebookGuard:true},'',location.href);window.addEventListener('popstate',handleAppBack);window.addEventListener('beforeunload',e=>{window.scrollTo(0,0);if(!exitConfirmed){e.preventDefault();e.returnValue='';setTimeout(()=>{exitConfirmed=false},0)}});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSettings()});document.addEventListener('gesturestart',e=>e.preventDefault(),{passive:false});document.addEventListener('touchstart',e=>{if(e.touches.length>1)e.preventDefault()},{passive:false});
function renderAll(){renderMatch();if(!document.getElementById('recordResults').hidden)renderRecords()}function download(n,c,t){let a=document.createElement('a'),u=URL.createObjectURL(new Blob([c],{type:t}));a.href=u;a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}function cell(v){return'"'+String(v??'').replace(/"/g,'""')+'"'}function renderRecords(){const box=document.getElementById('recordResults');let matches=db.matches.slice().sort((a,b)=>a.date.localeCompare(b.date));box.innerHTML=matches.length?matches.map(m=>{let heading=shortDateTime(m.date);let rows=m.rounds.map((r,i)=>'<tr><td>'+esc(shortDateTime(r.date||m.date))+'</td><td>'+ (i+1) +'</td>'+IDS.map(id=>'<td class="'+cls(r.scores[id])+'">'+fmt(r.scores[id])+'</td>').join('')+'</tr>').join('');if(m.finished){let t=totals(m);rows+='<tr class="total-row"><td></td><th>本場累計</th>'+IDS.map(id=>'<td class="'+cls(t[id])+'">'+fmt(t[id])+'</td>').join('')+'</tr>'}return '<div class="record-match"><div class="record-match-title"><h3>'+esc(heading)+'</h3><button class="delete-record" data-id="'+esc(m.id)+'" onclick="deleteMatch(this.dataset.id)">刪除此場</button></div><table class="record-table"><thead><tr><th>日期時間</th><th>局數</th>'+NAMES.map(n=>'<th>'+esc(n)+'</th>').join('')+'</tr></thead><tbody>'+(rows||'<tr><td colspan="6" class="muted">尚無逐局紀錄</td></tr>')+'</tbody></table></div>'}).join(''):'<p class="muted">目前沒有牌局記錄。</p>'}window.deleteMatch=id=>{let m=db.matches.find(x=>x.id===id);if(!m||!confirm('確定刪除此場及其逐局記錄？此操作無法復原。'))return;db.matches=db.matches.filter(x=>x.id!==id);if(db.active===id)db.active=null;saveDB()};document.getElementById('queryRecords').onclick=()=>{document.getElementById('recordResults').hidden=false;renderRecords()};document.getElementById('exportCsv').onclick=()=>{let rows=[['日期時間','局數',...NAMES]];db.matches.forEach(m=>{m.rounds.forEach((r,i)=>rows.push([shortDateTime(r.date||m.date),i+1,...IDS.map(id=>Number(r.scores[id]||0))]));if(m.finished){let t=totals(m);rows.push(['','本場累計',...IDS.map(id=>t[id])])}});download('拱豬計分簿記錄.csv','\ufeff'+rows.map(r=>r.map(cell).join(',')).join('\r\n'),'text/csv;charset=utf-8')};renderAll();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script>
